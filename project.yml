name: ClipTape
options:
  bundleIdPrefix: app.mactape
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ClipTape:
    type: application
    platform: macOS
    configFiles:
      Debug: ClipTape/Resources/Signing.xcconfig
      Release: ClipTape/Resources/Signing.xcconfig
    sources:
      - path: ClipTape
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mactape.recorder
        PRODUCT_NAME: ClipTape
        INFOPLIST_FILE: ClipTape/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ClipTape/Resources/ClipTape.entitlements
        ENABLE_APP_SANDBOX: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 3
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets:
        - ClipTapeTests
  ClipTapeTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: ClipTape/Resources/Signing.xcconfig
      Release: ClipTape/Resources/Signing.xcconfig
    sources:
      - path: ClipTapeTests
    dependencies:
      - target: ClipTape
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mactape.recorder.tests
        GENERATE_INFOPLIST_FILE: YES
